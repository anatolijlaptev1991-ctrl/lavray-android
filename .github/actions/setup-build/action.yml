# SPDX-License-Identifier: GPL-3.0-only
# Toolchain for the Go core (gomobile) and the Gradle app build on ubuntu runners:
# JDK 21, Go from the core's go.mod, Android SDK platform and build-tools, NDK, Gradle cache.
# The repository (with submodules) must already be checked out.
name: setup-build
description: JDK 21, Go, Android SDK and NDK, Gradle cache for LAVRay Android
inputs:
  cache-read-only:
    description: Restore the Gradle cache but never write it (release builds)
    default: "false"
  ndk-version:
    description: NDK version, must match scripts/build-core.sh
    default: "28.2.13676358"
  build-tools-version:
    description: Build-tools version (zipalign, apksigner)
    default: "36.0.0"
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    - uses: actions/setup-go@v5
      with:
        go-version-file: third_party/lavray/core/go.mod
        cache-dependency-path: third_party/lavray/core/go.sum

    - name: Android SDK and NDK
      shell: bash
      env:
        NDK_VERSION: ${{ inputs.ndk-version }}
        BUILD_TOOLS_VERSION: ${{ inputs.build-tools-version }}
      run: |
        sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        sm="$sdk/cmdline-tools/latest/bin/sdkmanager"
        [ -x "$sm" ] || { echo "::error::нет sdkmanager в $sdk"; exit 1; }
        pkgs=()
        [ -d "$sdk/platforms/android-36" ] || pkgs+=("platforms;android-36")
        [ -d "$sdk/build-tools/$BUILD_TOOLS_VERSION" ] || pkgs+=("build-tools;$BUILD_TOOLS_VERSION")
        [ -d "$sdk/ndk/$NDK_VERSION" ] || pkgs+=("ndk;$NDK_VERSION")
        if [ "${#pkgs[@]}" -gt 0 ]; then
          yes | "$sm" --licenses > /dev/null || true
          "$sm" --install "${pkgs[@]}" > /dev/null
        fi
        # The runner image presets ANDROID_NDK_HOME to its own default NDK; scripts/build-core.sh
        # trusts that variable, so it has to point at the pinned version.
        {
          echo "ANDROID_HOME=$sdk"
          echo "ANDROID_SDK_ROOT=$sdk"
          echo "ANDROID_NDK_HOME=$sdk/ndk/$NDK_VERSION"
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION"
        } >> "$GITHUB_ENV"

    - name: patch (build-core.sh applies core-overlay/patches)
      shell: bash
      run: command -v patch > /dev/null || sudo apt-get install -y --no-install-recommends patch

    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
